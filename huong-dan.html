const GS_CODE=`const SHEET='Log', POSTS='Posts', GROUP='Group', CFG='Config';
const COLS=['id','member','date','sport','km','min','bonus','proof','status','createdAt'];
const PCOLS=['id','publisher','date','platform','sourceFrom','url','createdAt'];
const GCOLS=['id','date','activity','members','createdAt'];

function ss(){return SpreadsheetApp.getActiveSpreadsheet();}
function tab(name,cols){
  var s=ss().getSheetByName(name);
  if(!s){s=ss().insertSheet(name);s.appendRow(cols);s.setFrozenRows(1);}
  return s;}
function sheet(){return tab(SHEET,COLS);}
function posts(){return tab(POSTS,PCOLS);}
function group(){return tab(GROUP,GCOLS);}
function cfg(){return tab(CFG,['key','value']);}

function fmt(d){
  if(!d)return '';
  if(Object.prototype.toString.call(d)==='[object Date]')
    return Utilities.formatDate(d,Session.getScriptTimeZone(),'yyyy-MM-dd');
  var s=String(d);
  if(/^\\d{4}-\\d{2}-\\d{2}$/.test(s))return s;
  var p=new Date(s);
  if(!isNaN(p.getTime()))return Utilities.formatDate(p,Session.getScriptTimeZone(),'yyyy-MM-dd');
  return s;}

function readAll(){
  var v=sheet().getDataRange().getValues(),rows=[];
  for(var i=1;i<v.length;i++){
    if(!v[i][0])continue;
    rows.push({id:String(v[i][0]),member:v[i][1],date:fmt(v[i][2]),sport:v[i][3],
      km:Number(v[i][4]||0),min:Number(v[i][5]||0),bonus:Number(v[i][6]||0),
      proof:v[i][7]||'none',status:v[i][8]||'pending'});}
  var p=posts().getDataRange().getValues(),plist=[];
  for(var k=1;k<p.length;k++){
    if(!p[k][0])continue;
    plist.push({id:String(p[k][0]),publisher:p[k][1],date:fmt(p[k][2]),platform:p[k][3],
      sourceFrom:p[k][4]||'',url:p[k][5]||''});}
  var gv=group().getDataRange().getValues(),glist=[];
  for(var q=1;q<gv.length;q++){
    if(!gv[q][0])continue;
    glist.push({id:String(gv[q][0]),date:fmt(gv[q][1]),activity:gv[q][2]||'',members:Number(gv[q][3]||0)});}
  var c=cfg().getDataRange().getValues(),team={};
  for(var j=1;j<c.length;j++){if(c[j][0])team[c[j][0]]=c[j][1];}
  return {rows:rows,posts:plist,sessions:glist,team:team};}

function out(o){return ContentService.createTextOutput(JSON.stringify(o))
  .setMimeType(ContentService.MimeType.JSON);}
function doGet(){return out(Object.assign({ok:true},readAll()));}

function findRow(s,id){
  var v=s.getDataRange().getValues();
  for(var i=1;i<v.length;i++){if(String(v[i][0])===String(id))return i+1;}
  return 0;}

function doPost(e){
  var lock=LockService.getScriptLock();lock.waitLock(20000);
  try{
    var b=JSON.parse(e.postData.contents);
    if(b.action==='add'){
      var r=b.row;
      sheet().appendRow([r.id,r.member,r.date,r.sport,r.km||'',r.min||'',r.bonus||'',
        r.proof||'none',r.status||'pending',new Date()]);
    }
    else if(b.action==='update'){
      var s=sheet(),n=findRow(s,b.id);
      if(n){Object.keys(b.patch||{}).forEach(function(k){
        var c=COLS.indexOf(k);
        if(c>0)s.getRange(n,c+1).setValue(b.patch[k]);});}
    }
    else if(b.action==='delete'){
      var s2=sheet(),n2=findRow(s2,b.id);if(n2)s2.deleteRow(n2);
    }
    else if(b.action==='post:add'){
      var p=b.post;
      posts().appendRow([p.id,p.publisher,p.date,p.platform,p.sourceFrom||'',p.url||'',new Date()]);
    }
    else if(b.action==='group:add'){
      var g=b.session;
      group().appendRow([g.id,g.date,g.activity||'',g.members||0,new Date()]);
    }
    else if(b.action==='group:delete'){
      var gs=group(),n4=findRow(gs,b.id);if(n4)gs.deleteRow(n4);
    }
    else if(b.action==='post:delete'){
      var ps=posts(),n3=findRow(ps,b.id);if(n3)ps.deleteRow(n3);
    }
    else if(b.action==='team'){
      var c=cfg(),cv=c.getDataRange().getValues(),keys={};
      for(var j=1;j<cv.length;j++)keys[cv[j][0]]=j+1;
      Object.keys(b.team||{}).forEach(function(k){
        if(keys[k])c.getRange(keys[k],2).setValue(b.team[k]);
        else c.appendRow([k,b.team[k]]);});
    }
    return out(Object.assign({ok:true},readAll()));
  }catch(err){return out({ok:false,error:String(err)});}
  finally{lock.releaseLock();}}`;

let LANG=localStorage.getItem("stepup15.lang")||"en";
const t=k=>I18N[LANG][k]??I18N.vi[k]??k;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tmr;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tmr);tmr=setTimeout(()=>e.classList.remove("on"),2500);}

let S={logs:{},posts:[],sessions:[],team:{}};
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign({logs:{},posts:[],sessions:[],team:{}},JSON.parse(raw));}catch(e){}
  MEMBERS.forEach(m=>{if(!Array.isArray(S.logs[m]))S.logs[m]=[];});
  if(!Array.isArray(S.posts))S.posts=[];
  if(!Array.isArray(S.sessions))S.sessions=[];}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
load();

function lvOf(v,tb){const h=tb.find(r=>v>=r[0]);return h?h[1]:0;}
function calc(m){
  let km=0,ses=0,bonus=0;
  (S.logs[m]||[]).forEach(r=>{
    if(r.sport==="Đi bộ/Chạy bộ")km+=Number(r.km||0);
    else if(r.sport==="Thử thách thêm")bonus+=Number(r.bonus||0);
    else if(SESSION_SPORTS.includes(r.sport))ses++;});
  return {km,ses,bonus,total:lvOf(km,WR)+lvOf(ses,BFP)+bonus};}

function applyLang(){
  document.documentElement.lang=LANG;localStorage.setItem("stepup15.lang",LANG);
  $$(".langsw button").forEach(b=>b.classList.toggle("on",b.dataset.lang===LANG));
  $$("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
  $("#where-tb").innerHTML=t("whereRows").map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("");
  $("#app-tb").innerHTML=t("appRows").map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td></tr>`).join("");
  $("#sheet-tb").innerHTML=t("sheetRows").map(r=>`<tr><td><b>${esc(r[0])}</b></td><td><code>${esc(r[1])}</code></td></tr>`).join("");
  const st=a=>a.map(x=>`<div class="step"><div><b>${esc(x[0])}</b><p>${esc(x[1])}</p></div></div>`).join("");
  $("#gs-steps").innerHTML=st(t("gsSteps"));
  $("#alt-steps").innerHTML=st(t("altSteps"));
  $("#alt-causes").innerHTML=t("altCauses").map(c=>
    `<div class="step" style="padding:13px 0"><div style="flex:none;font-size:20px;width:28px;text-align:center">${c[0]}</div>
     <div><b>${esc(c[1])}</b><p>${esc(c[2])}</p></div></div>`).join("");
  $("#alt-gs-code").textContent=ALT_CODE;
  $("#gh-steps").innerHTML=st(t("ghSteps"));
  $("#gs-code").textContent=GS_CODE;
  renderStatus();
}
$$(".langsw button").forEach(b=>b.addEventListener("click",()=>{LANG=b.dataset.lang;applyLang();}));
$("#sel-exp").innerHTML=MEMBERS.map(m=>`<option value="${esc(m)}">${esc(m)}</option>`).join("");

function renderStatus(){
  $("#status-list").innerHTML=MEMBERS.map(m=>{
    const rows=S.logs[m]||[],c=calc(m);
    return `<div class="item"><div class="main"><b>${esc(m)}</b>
      <span>${rows.length?rows.length+" "+t("s.records"):t("s.none")}</span></div>
      <span class="val">${c.total}</span></div>`;}).join("")+
    `<div class="item"><div class="main"><b>📣 Posts</b><span>${S.posts.length} ${t("s.posts")}</span></div></div>`;
}
$("#btn-copy-alt").addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText(ALT_CODE);toast(t("gs.copied"));}catch(e){
    const r=document.createRange();r.selectNode($("#alt-gs-code"));getSelection().removeAllRanges();getSelection().addRange(r);}});
$("#btn-copy").addEventListener("click",async()=>{
  try{await navigator.clipboard.writeText(GS_CODE);toast(t("gs.copied"));}catch(e){
    const r=document.createRange();r.selectNode($("#gs-code"));getSelection().removeAllRanges();getSelection().addRange(r);}});

function dl(n,txt,ty){const b=new Blob([txt],{type:ty}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=n;a.click();URL.revokeObjectURL(u);}
const stamp=()=>new Date().toISOString().slice(0,10).replace(/-/g,"");
$("#btn-exp-one").addEventListener("click",()=>{const m=$("#sel-exp").value;
  dl(`StepUp15_${m.replace(/\s+/g,"")}_${stamp()}.json`,
    JSON.stringify({app:"stepup15",version:2,exported:new Date().toISOString(),logs:{[m]:S.logs[m]}},null,2),"application/json");
  toast(t("t.exported"));});
$("#btn-exp-json").addEventListener("click",()=>{
  dl(`StepUp15_team_${stamp()}.json`,
    JSON.stringify({app:"stepup15",version:2,exported:new Date().toISOString(),logs:S.logs,posts:S.posts,team:S.team},null,2),"application/json");
  toast(t("t.exported"));});
$("#btn-exp-csv").addEventListener("click",()=>{
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const L=[["Member","Date","Sport","KM","Minutes","Bonus","Proof","Status"].map(q).join(",")];
  MEMBERS.forEach(m=>(S.logs[m]||[]).forEach(r=>L.push(
    [m,r.date,r.sport,r.km||"",r.min||"",r.bonus||"",r.proof||"none",r.status||""].map(q).join(","))));
  L.push("");L.push(["Member","KM","Sessions","Bonus","Total","Status"].map(q).join(","));
  MEMBERS.forEach(m=>{const c=calc(m);L.push([m,c.km,c.ses,c.bonus,c.total,c.total>=GOAL?"PASS":"NOT YET"].map(q).join(","));});
  L.push("");L.push(["Post date","Publisher","Platform","Source from","URL"].map(q).join(","));
  S.posts.forEach(p=>L.push([p.date,p.publisher,p.platform,p.sourceFrom,p.url].map(q).join(",")));
  L.push("");L.push(["Group session date","Activity","Members joined"].map(q).join(","));
  (S.sessions||[]).forEach(g=>L.push([g.date,g.activity,g.members].map(q).join(",")));
  dl(`StepUp15_${stamp()}.csv`,"﻿"+L.join("\r\n"),"text/csv;charset=utf-8");toast(t("t.exported"));});
$("#btn-imp").addEventListener("click",()=>$("#file-imp").click());
$("#file-imp").addEventListener("change",async e=>{
  let added=0,bad=0;
  for(const f of [...e.target.files]){
    try{const d=JSON.parse(await f.text());if(!d||!d.logs){bad++;continue;}
      Object.entries(d.logs).forEach(([m,rows])=>{
        if(!MEMBERS.includes(m)||!Array.isArray(rows))return;
        const seen=new Set(S.logs[m].map(r=>`${r.date}|${r.sport}|${r.km}|${r.min}|${r.bonus}`));
        rows.forEach(r=>{const k=`${r.date}|${r.sport}|${r.km}|${r.min}|${r.bonus}`;
          if(!seen.has(k)){S.logs[m].push(r);seen.add(k);added++;}});});
      if(Array.isArray(d.posts)){const ids=new Set(S.posts.map(p=>p.id));
        d.posts.forEach(p=>{if(!ids.has(p.id)){S.posts.push(p);ids.add(p.id);}});}
      if(d.team)Object.assign(S.team,d.team);
    }catch(err){bad++;}}
  save();renderStatus();e.target.value="";
  toast(`${t("t.merged")} ${added} ${t("t.records")}${bad?` · ${bad} ${t("t.bad")}`:""}`);});
$("#btn-reset").addEventListener("click",()=>{
  if(!confirm(t("t.confirm")))return;
  MEMBERS.forEach(m=>S.logs[m]=[]);S.posts=[];S.sessions=[];S.team={};save();renderStatus();toast(t("t.cleared"));});

applyLang();
</script>

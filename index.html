<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Step Up 15+</title>
<style>
@font-face{font-family:Metropolis;src:url(fonts/Metropolis-Regular.woff2) format('woff2'),url(Metropolis-Regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Metropolis;src:url(fonts/Metropolis-Medium.woff2) format('woff2'),url(Metropolis-Medium.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:Metropolis;src:url(fonts/Metropolis-SemiBold.woff2) format('woff2'),url(Metropolis-SemiBold.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Metropolis;src:url(fonts/Metropolis-Bold.woff2) format('woff2'),url(Metropolis-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:Metropolis;src:url(fonts/Metropolis-ExtraBold.woff2) format('woff2'),url(Metropolis-ExtraBold.woff2) format('woff2');font-weight:800;font-display:swap}
@font-face{font-family:Metropolis;src:url(fonts/Metropolis-Black.woff2) format('woff2'),url(Metropolis-Black.woff2) format('woff2');font-weight:900;font-display:swap}
:root{
  --blue:#0b5ed7; --black:#17181c; --red:#e0144c; --yellow:#f5a623; --green:#00a05a;
  --ink:#17181c; --muted:#767d8c; --line:#e8ecf3; --bg:#f6f8fc; --card:#fff;
  --r:20px; --sh:0 2px 4px rgba(20,30,60,.04),0 12px 30px rgba(20,30,60,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Metropolis,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit}
h1,h2,h3{margin:0;letter-spacing:-.02em}

/* HERO */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,#2b3fd4 0%,#3a63e8 55%,#4f7bf0 100%);color:#fff;padding:34px 22px 92px;text-align:center}
.hero svg.ribbon{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);width:min(920px,150%);height:auto}
.hero .inner{position:relative;z-index:2}
.brandline{display:inline-flex;align-items:center;gap:9px;font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#ffd978;margin-bottom:12px}
.brandline i{display:block;width:26px;height:1.5px;background:#ffd978}
.hero h1{font-size:clamp(34px,8vw,58px);font-weight:900;line-height:1}
.hero h1 b{color:#ffd978}
.hero p{margin:12px auto 0;max-width:470px;font-size:15px;color:#d8e2ff;font-weight:400}
.rings{display:flex;justify-content:center;margin-top:20px}
.rings i{display:block;width:26px;height:26px;border-radius:50%;border:4px solid;margin-right:-7px}
.langsw{position:absolute;top:18px;right:18px;z-index:3;display:flex;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.26);border-radius:999px;padding:3px}
.langsw button{border:0;background:none;color:#cdd9ff;font-size:12px;font-weight:800;letter-spacing:.06em;padding:6px 13px;border-radius:999px;cursor:pointer;transition:.18s}
.langsw button.on{background:#fff;color:#2b3fd4}

/* NAV */
nav{position:sticky;top:0;z-index:60;margin:-56px auto 0;max-width:1120px;padding:0 16px}
.nbar{background:#fff;border-radius:999px;box-shadow:0 8px 28px rgba(20,30,60,.14);padding:7px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.nbar::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:max-content;border:0;background:none;cursor:pointer;border-radius:999px;padding:11px 18px;font-size:14.5px;font-weight:700;color:var(--muted);white-space:nowrap;transition:.2s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:#fff}
main{max-width:1120px;margin:0 auto;padding:22px 16px 90px}
.page{display:none;animation:up .3s cubic-bezier(.2,.7,.3,1) both}
.page.on{display:block}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:28px 0 13px;flex-wrap:wrap}
.sec-h h2{font-size:19px;font-weight:800}
.sec-h span{font-size:13px;color:var(--muted)}
.syncbar{display:flex;align-items:center;gap:10px;justify-content:center;margin:14px 0 4px;font-size:12.5px;font-weight:600;color:var(--muted);flex-wrap:wrap}
.syncbar .dotx{width:8px;height:8px;border-radius:50%;background:#c3cad8}
.syncbar.cloud .dotx{background:var(--green);box-shadow:0 0 0 4px rgba(0,160,90,.15)}
.syncbar.err .dotx{background:var(--red)}
.syncbar button{border:0;background:#eef1f7;color:var(--ink);font-size:12px;font-weight:700;border-radius:999px;padding:5px 12px;cursor:pointer}

/* KPI */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{border-radius:var(--r);padding:18px 20px;color:#fff;position:relative;overflow:hidden}
.kpi b{display:block;font-size:30px;font-weight:900;line-height:1.1;letter-spacing:-.03em}
.kpi em{font-style:normal;font-size:12.5px;font-weight:600;opacity:.88}
.kpi::after{content:"";position:absolute;right:-26px;top:-26px;width:90px;height:90px;border-radius:50%;border:9px solid rgba(255,255,255,.18)}
.k1{background:linear-gradient(135deg,#0b5ed7,#3a7bea)}
.k2{background:linear-gradient(135deg,#00a05a,#35c184)}
.k3{background:linear-gradient(135deg,#e0144c,#f2577f)}
.k4{background:linear-gradient(135deg,#f5a623,#ffc55e);color:#4a3000}
.k4::after{border-color:rgba(255,255,255,.4)}

/* ---------- PODIUM ---------- */
.podwrap{position:relative;border-radius:26px;padding:26px 20px 22px;margin-bottom:16px;overflow:hidden;
  background:radial-gradient(120% 120% at 50% 0%,#24306b 0%,#141a3c 55%,#0d1129 100%)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;width:7px;height:11px;border-radius:2px;opacity:.75;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-30px) rotate(0)}100%{transform:translateY(320px) rotate(420deg)}}
.podtitle{position:relative;text-align:center;color:#ffd978;font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;margin-bottom:20px}
.podium{position:relative;display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:10px;align-items:end;max-width:760px;margin:0 auto}
.pod{border-radius:22px 22px 14px 14px;padding:16px 12px 16px;text-align:center;color:#fff;position:relative;overflow:hidden;cursor:pointer;border:0;font-family:inherit;transition:.2s}
.pod:hover{transform:translateY(-4px)}
.pod .no{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);font-size:132px;font-weight:900;line-height:1;color:rgba(255,255,255,.22);letter-spacing:-.05em;pointer-events:none}
.pod .av{position:relative;width:70px;height:70px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55)}
.pod .nm{position:relative;font-size:14px;font-weight:800;line-height:1.2}
.pod .sc{position:relative;font-size:24px;font-weight:900;margin-top:4px;letter-spacing:-.02em}
.pod .su{position:relative;font-size:11px;font-weight:600;opacity:.75}
.pod .crown{position:absolute;top:-2px;left:50%;transform:translateX(-50%);font-size:22px}
.pod1{background:linear-gradient(165deg,#2e7df5,#0b4fc0);min-height:232px;padding-top:28px;box-shadow:0 14px 34px rgba(11,94,215,.45)}
.pod2{background:linear-gradient(165deg,#5b6577,#2b3140);min-height:196px}
.pod3{background:linear-gradient(165deg,#f2577f,#c0103f);min-height:182px}
.pod .pill{background:rgba(255,255,255,.18);color:#fff}

/* RANK CARDS */
.lbgrid{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.lbc{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:10px 11px;cursor:pointer;border:1.5px solid transparent;
  transition:.18s;text-align:left;font-family:inherit;display:flex;flex-direction:column;gap:7px;min-width:104px}
.lbc:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(20,30,60,.12)}
.lbc.me{border-color:var(--blue);background:#f6f9ff}
.lbtop{display:flex;align-items:center;gap:7px}
.lbrank{font-size:13px;font-weight:900;color:#c3cad8;letter-spacing:-.03em;min-width:14px}
.lbc.me .lbrank{color:var(--blue)}
.av2{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10.5px;color:#fff}
.lbname{font-size:12.5px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbsc{display:flex;align-items:baseline;gap:3px}
.lbsc b{font-size:17px;font-weight:900;letter-spacing:-.03em;line-height:1}
.lbsc span{font-size:10px;font-weight:600;color:var(--muted)}
.rbar{height:5px;border-radius:99px;background:#eef1f7;overflow:hidden}
.rbar i{display:block;height:100%;border-radius:99px}
@media (max-width:640px){.lbc{min-width:118px}.lbname{font-size:11.5px;white-space:normal;min-height:28px}}

/* CARDS */
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:22px;margin-bottom:16px}
.panel.entry{margin-top:34px;padding:28px 24px 24px;border-radius:24px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#fffdf7 0%,#fff 58%);box-shadow:0 4px 10px rgba(245,166,35,.1),0 16px 44px rgba(20,30,60,.12)}
.panel.entry::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;
  background:linear-gradient(90deg,var(--blue) 0%,var(--black) 25%,var(--red) 50%,var(--yellow) 75%,var(--green) 100%)}
.panel.entry>h3{font-size:22px;font-weight:900;letter-spacing:-.03em}
.panel.entry>h3+p{font-size:13.5px;margin-bottom:20px}
.panel.entry .btn-go{padding:16px 24px;font-size:16px;border-radius:15px;box-shadow:0 6px 18px rgba(245,166,35,.35)}
.panel.entry .fld input,.panel.entry .fld select{border-width:2px}
@media (max-width:620px){.panel.entry{margin-top:26px;padding:22px 17px 18px}.panel.entry>h3{font-size:19px}}
.panel>h3{font-size:16px;font-weight:800;margin-bottom:4px}
.panel>h3+p{margin:0 0 16px;font-size:13px;color:var(--muted)}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 10px;background:#f1f4f9;color:var(--muted);display:inline-block}
.pill.win{background:#e4f7ee;color:var(--green)}
.pill.b{background:#e7f0ff;color:var(--blue)}
.pill.y{background:#fff3df;color:#9a6508}
.pill.r{background:#fdeaf0;color:var(--red)}

/* MEMBER HERO */
.mhero{background:#fff;border:2px solid var(--blue);border-radius:22px;padding:18px 20px;display:flex;flex-wrap:wrap;gap:18px;
  align-items:center;justify-content:space-between;margin-bottom:18px;box-shadow:0 4px 10px rgba(11,94,215,.08),0 14px 34px rgba(11,94,215,.12)}
.mhero .pick{display:flex;flex-direction:column;gap:6px;min-width:250px;flex:1}
.mhero label{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
.mhero select{background:#eef4ff;color:var(--ink);border:2px solid #c9ddff;border-radius:14px;padding:13px 40px 13px 15px;font-weight:800;font-size:16px;width:100%;appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%230b5ed7' stroke-width='2.4' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 15px center}
.mhero select:hover{border-color:var(--blue)}
.mhero select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,94,215,.16)}
.mstat{display:flex;gap:10px;flex-wrap:wrap}
.mstat div{background:#f6f8fc;border-radius:14px;padding:10px 16px;min-width:92px;text-align:center}
.mstat div:first-child{background:#eef4ff}
.mstat div b{display:block;font-size:26px;font-weight:900;line-height:1.1;letter-spacing:-.03em;color:var(--blue)}
.mstat div:nth-child(2) b{color:var(--yellow)}
.mstat div:nth-child(3) b{color:var(--ink)}
.mstat div span{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.05em}

/* SPORTS */
.sports{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));margin-bottom:18px}
.sp{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 8px;cursor:pointer;text-align:center;transition:.18s;font-weight:700;font-size:13px;color:var(--muted);font-family:inherit}
.sp em{display:block;font-size:26px;font-style:normal;line-height:1;margin-bottom:7px;filter:grayscale(.45);transition:.18s}
.sp:hover{border-color:#cbd5e6}
.sp.on{color:#fff;border-color:transparent;transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,30,60,.16)}
.sp.on em{filter:none}
.sp[data-c=blue].on{background:var(--blue)} .sp[data-c=red].on{background:var(--red)}
.sp[data-c=yellow].on{background:var(--yellow);color:#4a3000} .sp[data-c=green].on{background:var(--green)}
.sp[data-c=black].on{background:var(--black)}

/* FORM */
.frow{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fld input,.fld select{border:2px solid var(--line);border-radius:13px;padding:11px 13px;font-size:15px;font-weight:600;background:#fff;color:var(--ink);width:100%;transition:.15s;font-family:inherit}
.fld select{appearance:none;padding-right:36px;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%23767d8c' stroke-width='2' stroke-linecap='round'/></svg>");background-repeat:no-repeat;background-position:right 13px center}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--blue)}
.btn{border:0;border-radius:13px;padding:13px 24px;font-size:14.5px;font-weight:800;cursor:pointer;transition:.18s;white-space:nowrap;font-family:inherit}
.btn-main{background:var(--ink);color:#fff}
.btn-main:hover{background:#000;transform:translateY(-1px)}
.btn-go{background:var(--yellow);color:#4a3000}
.btn-go:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn-o{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn-o:hover{border-color:var(--ink)}
.btn-full{width:100%}
.btn[disabled]{opacity:.55;cursor:wait}
.tip{margin-top:14px;font-size:13px;color:var(--muted);background:#f1f4f9;border-radius:13px;padding:11px 15px}

/* PROGRESS */
.pgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.pbox{border-radius:18px;padding:16px 18px;background:#f8fafd;border:1px solid var(--line)}
.pbox .t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pbox .t b{font-size:21px;font-weight:900}
.pbox .t span{font-size:12.5px;font-weight:700;color:var(--muted)}
.lvbar{display:flex;gap:4px;margin:11px 0 7px}
.lvbar i{flex:1;height:7px;border-radius:99px;background:#e3e8f1}
.lvbar i.on{background:currentColor}
.pbox small{font-size:12px;color:var(--muted)}
.c-blue{color:var(--blue)} .c-red{color:var(--red)} .c-yellow{color:var(--yellow)} .c-green{color:var(--green)} .c-black{color:var(--black)}

/* LOG */
.log{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:12px 15px;border-radius:15px;background:#f8fafd;border:1px solid var(--line);flex-wrap:wrap}
.item .dot{width:11px;height:11px;border-radius:50%;flex:none;background:currentColor}
.item .main{flex:1;min-width:120px}
.item .main b{font-size:14px;font-weight:700;display:block}
.item .main span{font-size:12.5px;color:var(--muted)}
.item .val{font-weight:800;font-size:14.5px;white-space:nowrap}
.item select{border:1.5px solid var(--line);border-radius:10px;padding:5px 9px;font-size:12px;font-weight:700;background:#fff;cursor:pointer;font-family:inherit}
.iconbtn{border:0;background:none;cursor:pointer;color:#aab2c2;font-size:15px;line-height:1;padding:5px 3px;border-radius:7px}
.iconbtn:hover{color:var(--ink);background:#eef1f7}
.iconbtn.dl:hover{color:var(--red)}
.editbox{width:100%;border-top:1px dashed var(--line);margin-top:10px;padding-top:12px}
.empty{text-align:center;padding:38px 16px;color:var(--muted);font-size:14px}
.empty em{display:block;font-size:40px;font-style:normal;margin-bottom:10px;opacity:.45}

/* VIRAL */
.postgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.prow{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:12px;background:#f8fafd;border:1px solid var(--line);font-size:13px;min-width:0}
.prow .pico{font-size:14px;flex:none;line-height:1}
.prow .pmain{flex:1;min-width:0;display:flex;align-items:baseline;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pplat{font-weight:800;color:var(--ink);flex:none}
.prow .pmeta{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.prow a.plink{color:var(--red);font-weight:700;font-size:12px;flex:none;text-decoration:none}
.prow a.plink:hover{text-decoration:underline}
.flow{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.fstep{border-radius:18px;padding:17px 18px;background:#f8fafd;border:1px solid var(--line);position:relative}
.fstep .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.fstep b{display:block;font-size:14.5px;margin-bottom:3px}
.fstep p{margin:0;font-size:12.5px;color:var(--muted)}
.fstep.hot{background:#fff3df;border-color:#f6ddb0}
.fstep.hot .n{background:var(--yellow);color:#4a3000}
.pubchips{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.pubchip{background:#fff;border:1.5px solid #f0dcb3;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;color:#9a6508}

/* RULES */
.ladder{display:flex;flex-direction:column;gap:7px}
.lv{display:flex;align-items:center;gap:12px;padding:11px 15px;border-radius:14px;background:#f8fafd}
.lv b{width:42px;font-weight:900;font-size:14px}
.lv .need{flex:1;font-size:13.5px;color:var(--muted);font-weight:600}
.lv .pt{font-weight:900;font-size:15px}
.two{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.rule{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
.rule:first-child{border-top:0;padding-top:0}
.rule em{font-style:normal;font-size:22px;line-height:1.1;flex:none}
.rule b{display:block;font-size:14.5px}
.rule p{margin:2px 0 0;font-size:13px;color:var(--muted);word-break:break-word}
.prize{display:flex;align-items:center;gap:13px;padding:12px 0;border-top:1px solid var(--line)}
.prize:first-child{border-top:0}
.prize .m{font-weight:900;font-size:13.5px;border-radius:11px;padding:7px 12px;white-space:nowrap;min-width:104px;text-align:center}
.prize b{display:block;font-size:14.5px}
.prize p{margin:1px 0 0;font-size:12.5px;color:var(--muted)}
.bg-blue{background:#e7f0ff;color:var(--blue)} .bg-green{background:#e4f7ee;color:var(--green)}
.bg-yellow{background:#fff3df;color:#9a6508} .bg-red{background:#fdeaf0;color:var(--red)} .bg-black{background:#eceef3;color:var(--black)}

#ovl{position:fixed;inset:0;z-index:300;background:rgba(14,20,35,.55);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;padding:20px}
#ovl.on{display:flex;animation:fadein .16s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.dlg{background:#fff;border-radius:22px;max-width:380px;width:100%;padding:26px 24px 20px;text-align:center;
  box-shadow:0 24px 60px rgba(10,16,30,.3);animation:pop .2s cubic-bezier(.2,.8,.3,1.1) both}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
.dlg .ic{font-size:34px;line-height:1;margin-bottom:12px}
.dlg h4{margin:0 0 6px;font-size:18px;font-weight:900;letter-spacing:-.02em}

let tmr; function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("on");clearTimeout(tmr);tmr=setTimeout(()=>el.classList.remove("on"),2600);}
function lvOf(v,tb){const h=tb.find(r=>v>=r[0]);return h?{lv:tb.length-tb.indexOf(h),pts:h[1]}:{lv:0,pts:0};}
function nextStep(v,tb){const asc=[...tb].reverse(),up=asc.find(r=>r[0]>v);
  return up?{need:up[0]-v,lv:tb.length-tb.findIndex(r=>r[0]===up[0])}:null;}
const sportDef=n=>SPORT_DEF.find(s=>s.n===n)||SPORT_DEF[0];

function calc(name){
  const rows=S.logs[name]||[];
  let km=0,ses=0,bonus=0,sourced=0,verified=0;const used=new Set();
  rows.forEach(r=>{
    if(r.sport==="Đi bộ/Chạy bộ"){km+=Number(r.km||0);used.add(r.sport);}
    else if(r.sport==="Thử thách thêm"){bonus+=Number(r.bonus||0);}
    else if(SESSION_SPORTS.includes(r.sport)){ses++;used.add(r.sport);}
    if(r.proof&&r.proof!=="none")sourced++;
    if(r.status==="verified")verified++;});
  const a=lvOf(km,WR),b=lvOf(ses,BFP);
  return {km,ses,bonus,sourced,verified,sports:used,lvA:a.lv,ptsA:a.pts,lvB:b.lv,ptsB:b.pts,
    total:a.pts+b.pts+bonus,rows:rows.length};
}

/* ===== CLOUD ===== */
function setSync(state,msg){
  syncState=state;
  const bar=$("#syncbar");bar.className="syncbar"+(state==="cloud"?" cloud":state==="err"?" err":"");
  $("#sync-text").textContent=msg||(state==="cloud"?t("sync.cloud"):state==="err"?t("sync.err"):t("sync.local"));
}
const isoDate=v=>{
  const str=String(v||"");
  if(/^\d{4}-\d{2}-\d{2}$/.test(str))return str;
  const p=new Date(str);
  if(isNaN(p.getTime()))return str;
  const pad=n=>String(n).padStart(2,"0");
  return `${p.getFullYear()}-${pad(p.getMonth()+1)}-${pad(p.getDate())}`;};
function applyRemote(d){
  MEMBERS.forEach(m=>S.logs[m]=[]);
  (d.rows||[]).forEach(r=>{if(MEMBERS.includes(r.member))S.logs[r.member].push({...r,date:isoDate(r.date)});});
  S.posts=(Array.isArray(d.posts)?d.posts:[]).map(x=>({...x,date:isoDate(x.date)}));
  S.sessions=(Array.isArray(d.sessions)?d.sessions:[]).map(x=>({...x,date:isoDate(x.date)}));
  if(d.team){["folder"].forEach(k=>{if(d.team[k]!==undefined)S.team[k]=d.team[k];});}
  save();
}
async function pull(silent){
  if(!api()){setSync("local");return;}
  if(!silent)setSync("cloud",t("sync.loading"));
  try{const r=await fetch(api()+"?ts="+Date.now());const d=await r.json();
    if(!d.ok)throw 0;applyRemote(d);renderAll();setSync("cloud");}
  catch(e){setSync("err");}
}
async function push(payload){
  if(!api())return false;
  try{const r=await fetch(api(),{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    const d=await r.json();if(!d.ok)throw 0;applyRemote(d);renderAll();setSync("cloud");return true;}
  catch(e){setSync("err");return false;}
}
$("#btn-sync").addEventListener("click",()=>api()?pull():toast(t("sync.local")));

      <span class="dot"></span>
      <div class="main"><b style="color:var(--ink)">${d.icon} ${esc(t(d.k))}</b>
        <span>${fmtDate(r.date)} · ${r.proof==="drive"?"📁 "+esc(t("log.drive")):r.proof==="zalo"?"💬 "+esc(t("log.zalo")):"— "+esc(t("log.noproof"))}</span></div>
      <span class="val" style="color:var(--ink)">${val}</span>
      <select class="sel-st" data-id="${esc(r.id||"")}" data-i="${r._i}">
        <option value="pending"${r.status!=="verified"?" selected":""}>${t("st.pending")}</option>
        <option value="verified"${r.status==="verified"?" selected":""}>${t("st.verified")}</option></select>
      <button class="iconbtn ed" data-id="${esc(r.id||"")}" title="${esc(t("ed.title"))}">✏️</button>
      <button class="iconbtn dl" data-id="${esc(r.id||"")}" data-i="${r._i}">✕</button>
      ${editing?`<div class="editbox">
        <div class="frow">
          <div class="fld"><label>${esc(t("f.date"))}</label><input type="date" id="e-date" value="${esc(r.date)}"></div>
          <div class="fld"><label>${esc(t("f.sport"))}</label><select id="e-sport">
            ${SPORT_DEF.map(s=>`<option value="${esc(s.n)}"${s.n===r.sport?" selected":""}>${s.icon} ${esc(t(s.k))}</option>`).join("")}</select></div>
          <div class="fld"><label id="e-lab">${esc(r.sport==="Đi bộ/Chạy bộ"?t("f.km"):r.sport==="Thử thách thêm"?t("f.bonus"):t("f.min"))}</label>
            <input type="number" id="e-val" min="0" step="0.1" value="${r.km||r.min||r.bonus||0}"></div>
          <div class="fld"><label>${esc(t("f.proof"))}</label><select id="e-proof">
            <option value="none"${!r.proof||r.proof==="none"?" selected":""}>${esc(t("f.proof.none"))}</option>
            <option value="drive"${r.proof==="drive"?" selected":""}>${esc(t("f.proof.drive"))}</option>
            <option value="zalo"${r.proof==="zalo"?" selected":""}>${esc(t("f.proof.zalo"))}</option></select></div>
        </div>
        <div class="frow" style="margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
          <button class="btn btn-main savex" data-id="${esc(r.id)}" data-i="${r._i}">${esc(t("ed.save"))}</button>
          <button class="btn btn-o cancelx">${esc(t("ed.cancel"))}</button></div></div>`:""}
    </div>`;}).join("");

  $$("#log .sel-st").forEach(s=>s.addEventListener("change",async e=>{
    const i=+e.target.dataset.i;S.logs[name][i].status=e.target.value;save();renderAll();toast(t("t.updated"));
    await push({action:"update",id:e.target.dataset.id,patch:{status:e.target.value}});}));
  $$("#log .ed").forEach(b=>b.addEventListener("click",()=>{
    EDITING=EDITING===b.dataset.id?null:b.dataset.id;renderLog();
    const sel=$("#e-sport");
    if(sel)sel.addEventListener("change",()=>{const v=sel.value;
      $("#e-lab").textContent=v==="Đi bộ/Chạy bộ"?t("f.km"):v==="Thử thách thêm"?t("f.bonus"):t("f.min");});}));
  $$("#log .cancelx").forEach(b=>b.addEventListener("click",()=>{EDITING=null;renderLog();}));
  $$("#log .savex").forEach(b=>b.addEventListener("click",async()=>{
    const i=+b.dataset.i,id=b.dataset.id,sp=$("#e-sport").value,val=Number($("#e-val").value||0);
    if(sp==="Đi bộ/Chạy bộ"&&val<1)return toast(t("t.minKm"));
    if(SESSION_SPORTS.includes(sp)&&val<30)return toast(t("t.minMin"));
    if(sp==="Thử thách thêm"&&val<=0)return toast(t("t.needBonus"));
    const patch={date:$("#e-date").value,sport:sp,
      km:sp==="Đi bộ/Chạy bộ"?val:0,min:SESSION_SPORTS.includes(sp)?val:0,
      bonus:sp==="Thử thách thêm"?val:0,proof:$("#e-proof").value};
    Object.assign(S.logs[name][i],patch);save();EDITING=null;renderAll();toast(t("t.updated"));
    await push({action:"update",id,patch});}));
  $$("#log .dl").forEach(b=>b.addEventListener("click",async()=>{
    const i=+b.dataset.i,id=b.dataset.id;
    const row=S.logs[name][i],d=sportDef(row.sport);
    if(!await confirmBox(t("dlg.delTitle"),`${d.icon} ${t(d.k)} · ${fmtDate(row.date)} · ${row.km?nf(row.km)+" "+t("u.km"):row.min?nf(row.min)+" "+t("u.min"):"+"+nf(row.bonus)+t("u.pt")}`))return;
    S.logs[name].splice(i,1);save();EDITING=null;renderAll();toast(t("t.deleted"));
    await push({action:"delete",id});}));
}

/* ===== TEAM ===== */
function renderTeam(){
  const all=MEMBERS.map((m,i)=>({name:m,idx:i,...calc(m)}));
  const sum=k=>all.reduce((a,b)=>a+b[k],0);
  const total=sum("total"),pass=all.filter(a=>a.total>=GOAL).length;
  const sp=new Set();all.forEach(a=>a.sports.forEach(s=>sp.add(s)));
  $("#k-avg").textContent=nf(Math.round(total/MEMBERS.length));
  $("#k-pass").textContent=pass+"/10";
  $("#k-viral").textContent=nf(S.posts.length);
  $("#k-sports").textContent=sp.size+"/4";

  const ranked=[...all].sort((a,b)=>b.total-a.total);
  const me=$("#sel-member").value;
  const top=ranked.slice(0,3),rest=ranked.slice(3);
  const podOrder=[top[1],top[0],top[2]],podCls=["pod2","pod1","pod3"],podNo=["2","1","3"];
  $("#podium").innerHTML=podOrder.map((a,i)=>{
    if(!a)return"";
    const pct=Math.min(100,Math.round(a.total/GOAL*100));
    return `<button class="pod ${podCls[i]}" data-m="${esc(a.name)}">
      ${podCls[i]==="pod1"?'<div class="crown">👑</div>':""}
      <span class="no">${podNo[i]}</span>
      <div class="av">${esc(initials(a.name))}</div>
      <div class="nm">${esc(a.name)}</div>
      <div class="sc">${nf(a.total)}</div>
      <div class="su">${pct}% ${esc(t("goal"))}</div>
      <div style="position:relative;margin-top:8px"><span class="pill">${a.km?"🏃 "+nf(a.km)+" "+t("u.km"):a.ses?"🏸 "+a.ses+" "+t("u.ses"):"—"}</span></div>
    </button>`;}).join("");

  $("#ranklist").innerHTML=rest.map((a,i)=>{
    const col=COLORS[RINGC[a.idx%5]],pct=Math.min(100,a.total/GOAL*100);
    return `<button class="lbc${a.name===me?" me":""}" data-m="${esc(a.name)}" title="${esc(a.name)}">
      <span class="lbtop"><span class="lbrank">${i+4}</span>
        <span class="av2" style="background:${col}">${esc(initials(a.name))}</span></span>
      <span class="lbname">${esc(shortName(a.name))}</span>
      <span class="lbsc"><b style="color:${a.total>=GOAL?COLORS.green:"var(--ink)"}">${nf(a.total)}</b><span>/ 300</span></span>
      <span class="rbar"><i style="width:${pct}%;background:${a.total>=GOAL?COLORS.green:col}"></i></span>
    </button>`;}).join("");
  $$("[data-m]").forEach(el=>el.addEventListener("click",()=>{
    $("#sel-member").value=el.dataset.m;renderAll();window.scrollTo({top:0,behavior:"smooth"});}));

  if(!$("#confetti").dataset.done){
    const cols=[COLORS.blue,COLORS.red,COLORS.yellow,COLORS.green,"#ffffff"];
    $("#confetti").innerHTML=Array.from({length:26},(_,i)=>
      `<i style="left:${Math.round(Math.random()*100)}%;background:${cols[i%5]};animation-duration:${(4+Math.random()*5).toFixed(1)}s;animation-delay:-${(Math.random()*6).toFixed(1)}s"></i>`).join("");
    $("#confetti").dataset.done="1";
  }

  const contributors=new Set();
  MEMBERS.forEach(m=>{if(calc(m).sourced>0)contributors.add(m);});
  S.posts.forEach(p=>{if(p.sourceFrom)contributors.add(p.sourceFrom);});
  const U=t("track.m");
  const amt=["10.000.000","5.000.000","4.000.000","3.000.000","3.000.000"];
  const bgc=["bg-blue","bg-green","bg-yellow","bg-red","bg-black"];
  const g=groupStats();
  const figs=[nf(Math.round(total/MEMBERS.length))+" "+U[0],
    g.n?g.avg+" "+U[1]:t("track.empty"),
    sp.size+"/4 "+U[2],pass+"/10 "+U[3],
    nf(S.posts.length)+" "+U[4]+(contributors.size?` · ${contributors.size}/10`:"")];
  $("#prize-track").innerHTML=t("prizes").slice(0,5).map((p,i)=>
    `<div class="prize"><span class="m ${bgc[i]}">${amt[i]}</span>
     <div style="flex:1"><b>${esc(p[0])}</b><p>${esc(t("track.now"))}</p></div>
     <b style="font-size:15px;white-space:nowrap">${esc(figs[i])}</b></div>`).join("");
}

/* ===== VIRAL ===== */
$("#btn-post").addEventListener("click",async()=>{
  const url=$("#p-url").value.trim();
  if(!url)return toast(t("v.needUrl"));
  const post={id:uid(),publisher:$("#p-publisher").value,date:$("#p-date").value,
    platform:$("#p-platform").value,sourceFrom:$("#p-source").value,url,ts:Date.now()};
  S.posts.push(post);save();$("#p-url").value="";renderAll();toast(t("t.added"));
  if(api()){const b=$("#btn-post");b.disabled=true;await push({action:"post:add",post});b.disabled=false;}
});
$("#btn-folder").addEventListener("click",async()=>{
  S.team.folder=$("#in-folder").value.trim();save();toast(t("t.saved"));
  await push({action:"team",team:S.team});});
$("#btn-open-folder").addEventListener("click",()=>{
  const u=(S.team.folder||"").trim();
  if(!u)return toast(t("v.needFolder"));
  window.open(u,"_blank","noopener");});

function renderViral(){
  $("#in-folder").value=S.team.folder||"";
  const sourced=MEMBERS.map(m=>({m,n:calc(m).sourced}));
  const contribMembers=sourced.filter(x=>x.n>0).length;
  $("#v-posts").textContent=nf(S.posts.length);
  $("#v-src").textContent=contribMembers+"/10";
  $("#v-photos").textContent=nf(sourced.reduce((a,b)=>a+b.n,0));
  $("#v-count").textContent=S.posts.length+" "+t("v.posts");
  const posts=[...S.posts].sort((a,b)=>(a.date<b.date?1:-1));
  $("#postlog").innerHTML=posts.length?posts.map(p=>
    `<div class="prow">
      <span class="pico">${PLAT[p.platform]||"📣"}</span>
      <span class="pmain"><span class="pplat">${esc(p.platform)}</span>
        <span class="pmeta">${fmtDate(p.date)} · ${esc(shortName(p.publisher))} · 📷 ${esc(shortName(p.sourceFrom||"—"))}</span></span>
      ${p.url?`<a class="plink" href="${esc(p.url)}" target="_blank" rel="noopener">link</a>`:""}
      <button class="iconbtn dl pdel" data-id="${esc(p.id)}">✕</button></div>`).join("")
    :`<div class="empty"><em>📣</em>${t("v.empty")}</div>`;
  $$("#postlog .pdel").forEach(b=>b.addEventListener("click",async()=>{
    const po=S.posts.find(x=>x.id===b.dataset.id)||{};
    if(!await confirmBox(t("dlg.delPostTitle"),`${PLAT[po.platform]||"📣"} ${po.platform||""} · ${fmtDate(po.date)} · ${shortName(po.publisher||"")}`))return;
    S.posts=S.posts.filter(p=>p.id!==b.dataset.id);save();renderAll();toast(t("t.deleted"));
    await push({action:"post:delete",id:b.dataset.id});}));

}

/* ===== GROUP SESSIONS ===== */
function groupStats(){
  const n=S.sessions.length;
  const sum=S.sessions.reduce((a,b)=>a+Number(b.members||0),0);
  return {n,sum,avg:n?(Math.round(sum/n*10)/10):0,five:S.sessions.filter(x=>Number(x.members||0)>=5).length};
}
$("#g-date").value=new Date().toISOString().slice(0,10);
$("#btn-group").addEventListener("click",async()=>{
  const date=$("#g-date").value,act=$("#g-act").value,members=Number($("#g-members").value||0);
  if(!date)return toast(t("t.pickDate"));
  if(members<1)return toast(t("group.needMembers"));
  const ses={id:uid(),date,activity:act,members,ts:Date.now()};
  S.sessions.push(ses);save();$("#g-members").value="";renderAll();toast(t("t.added"));
  if(api()){const b=$("#btn-group");b.disabled=true;await push({action:"group:add",session:ses});b.disabled=false;}
});
function renderGroup(){
  const g=groupStats();
  $("#g-avg").textContent=g.n?nf(g.avg):"0";
  $("#g-five").textContent=g.five;
  $("#g-count").textContent=g.n;
  $("#g-listcount").textContent=g.n+" "+t("group.sessions");
  const rows=[...S.sessions].sort((a,b)=>(a.date<b.date?1:-1));
  const box=$("#grouplog");
  if(!rows.length){box.innerHTML=`<div class="empty"><em>👥</em>${esc(t("group.empty"))}</div>`;return;}
  box.innerHTML=rows.map(r=>{
    const d=SPORT_DEF.find(x=>x.n===r.activity),col=d?COLORS[d.c]:COLORS.black;
    const label=d?t(d.k):(!r.activity||r.activity==="other"?t("group.other"):r.activity);
    const big=Number(r.members||0)>=5;
    return `<div class="item" style="color:${col}"><span class="dot"></span>
      <div class="main"><b style="color:var(--ink)">${d?d.icon:"👥"} ${esc(label)}</b>
      <span>${fmtDate(r.date)}</span></div>
      <span class="val" style="color:var(--ink)">${nf(r.members)} ${esc(t("group.people"))}</span>
      ${big?`<span class="pill win">5+</span>`:""}
      <button class="iconbtn dl gdel" data-id="${esc(r.id)}">✕</button></div>`;}).join("");
  $$("#grouplog .gdel").forEach(b=>b.addEventListener("click",async()=>{
    const gr=S.sessions.find(x=>x.id===b.dataset.id)||{};
    if(!await confirmBox(t("dlg.delGroupTitle"),`${fmtDate(gr.date)} · ${nf(gr.members||0)} ${t("group.people")}`))return;
    S.sessions=S.sessions.filter(x=>x.id!==b.dataset.id);save();renderAll();toast(t("t.deleted"));
    await push({action:"group:delete",id:b.dataset.id});}));
}

function renderAll(){renderTeam();renderViral();renderGroup();renderMe();}

applyLang();
if(api()){setSync("cloud",t("sync.loading"));pull(true);}else setSync("local");
</script>
</body>
</html>
